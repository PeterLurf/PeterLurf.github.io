# Builds the site with build.py and publishes it to GitHub Pages on every push to main.
# So you can edit or add a post on github.com and it goes live a minute later, without running anything yourself.
#
# One-time setup: on GitHub, Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Progress and errors show in the repository's Actions tab.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab
  schedule:
    - cron: "0 9 * * *"   # every day at 09:00 UTC, so the Compute totals stay current

permissions:
  contents: write   # to save the compute history on the data branch
  pages: write
  id-token: write

# If you push twice quickly, finish the first deploy and skip to the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, so the sitemap can date each page by its last commit

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The month-by-month record of compute spend lives on the data branch (see spend.py).
      - name: Load compute history
        run: |
          if git fetch -q origin data && git show origin/data:compute.json > "$RUNNER_TEMP/compute.json"; then
            cp "$RUNNER_TEMP/compute.json" compute.json
          else
            echo "No history yet: starting one"
          fi

      # Monthly amounts only: the keys stay in GitHub's secrets and never reach the published site.
      - name: Fetch compute spend
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY || secrets.VAST }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY || secrets.RUNPOD }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL: ${{ secrets.MODAL }}   # or both Modal tokens in one secret, e.g. the "modal token set ..." line
        run: |
          pip install modal
          python spend.py

      - name: Save compute history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify origin/data > /dev/null; then
            git worktree add -q --detach "$RUNNER_TEMP/data" origin/data
          else
            git worktree add -q --orphan -b data "$RUNNER_TEMP/data"
          fi
          cp compute.json "$RUNNER_TEMP/data/compute.json"
          cd "$RUNNER_TEMP/data"
          git add compute.json
          git diff --cached --quiet || { git commit -q -m "Update compute history" && git push -q origin HEAD:data; }

      - name: Build
        run: |
          pip install markdown
          python build.py

      # Publish only the site: leave out the mockups, templates and repository files.
      - name: Collect the site
        run: rsync -a --exclude _site --exclude .git --exclude .github --exclude options --exclude templates --exclude '*.py' ./ _site/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
